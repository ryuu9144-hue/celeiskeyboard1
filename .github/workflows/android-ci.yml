
name: Android CI - Celeis Keyboard

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Run unit tests
      - name: Run unit tests
        working-directory: celeis-keyboard
        run: gradle testDebugUnitTest --no-daemon

      # 5. Build debug APK
      - name: Build Debug APK
        working-directory: celeis-keyboard
        run: gradle assembleDebug --no-daemon

      # 6. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Celeis-Keyboard-Debug-APK
          path: celeis-keyboard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
